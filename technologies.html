<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="js/head-loader.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

  <header>
    <nav id="navbar-container"></nav>
  </header>

  <section class="py-16 px-6 max-w-6xl mx-auto">
    <h2 class="text-3xl font-bold text-center mb-10" data-i18n="tech_page_title">Technologies I Work With</h2>

    <div class="w-full max-w-5xl mx-auto p-6 bg-white rounded-2xl shadow-md">
      <div class="grid gap-6 md:grid-cols-3 mb-6">
        <div>
          <label for="categorySelect" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="tech_label_category">Category</label>
          <select id="categorySelect" class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
            <option value="all" data-i18n="tech_opt_all">All</option>
            <option value="proyectos" data-i18n="tech_opt_projects">Projects</option>
            <option value="categoria1" data-i18n="tech_opt_cat1">Category 1</option>
            <option value="categoria2" data-i18n="tech_opt_cat2">Category 2</option>
          </select>
        </div>

        <div>
          <label for="subCategorySelect" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="tech_label_subcategory">Subcategory</label>
          <select id="subCategorySelect" class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
            </select>
        </div>

        <div>
          <label for="displayTypeSelect" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="tech_label_display">Display Type</label>
          <select id="displayTypeSelect" class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
            <option value="select" data-i18n="tech_opt_select">Select</option>
            <option value="checkbox" data-i18n="tech_opt_checkbox">Checkboxes</option>
          </select>
        </div>
      </div>

      <div id="subCategoryCheckboxes" class="mb-6 flex flex-wrap gap-3"></div>

    </div>

    <div id="category-container" class="mt-10"></div>
  </section>

  <footer class="site-footer" id="footer-container"></footer>

  <style>
    .tech-card {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .tech-card.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
  <script src="/js/technologies.js"></script>
</body>
</html>
