<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="js/head-loader.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

  <header>
    <nav id="navbar-container"></nav>
  </header>

  <section id="projects" class="py-24 px-6 lg:px-20 bg-white text-gray-900">
    <div class="max-w-6xl mx-auto">

      <div class="text-center mb-20">
        <h2 class="text-4xl md:text-5xl font-semibold tracking-tight" data-i18n="projects_page_title">
          Selected Work
        </h2>
        <p class="text-gray-500 mt-4" data-i18n="projects_page_subtitle">
          A selection of projects focused on performance, design, and scalability.
        </p>
      </div>

      <div class="mb-24">
        <div id="featured-projects" class="flex flex-col gap-20"></div>
      </div>

      <div>
        <h3 class="text-2xl font-medium mb-10" data-i18n="projects_other_title">Other Projects</h3>
        <div id="other-projects" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </div>

    </div>
  </section>

  <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 md:p-8">
    <div class="relative max-w-[1435px] w-full max-h-[90vh] flex items-center justify-center">
      <button id="modal-close" class="absolute -top-10 right-2 text-white text-4xl font-bold hover:text-gray-300 transition cursor-pointer z-10">&times;</button>
      <img id="modal-img" src="" alt="Project Preview" class="w-full h-auto max-h-[85vh] rounded-xl shadow-2xl object-cover border border-gray-700">
    </div>
  </div>

  <footer class="site-footer" id="footer-container"></footer>

  <script src="/js/projects.js"></script>
</body>
</html>
