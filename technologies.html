<div class="w-full max-w-5xl mx-auto p-6 bg-white rounded-2xl shadow-md">
  <!-- Selectores -->
  <div class="grid md:grid-cols-3 gap-6 mb-6">
    <!-- Selector 1: Categorías -->
    <div>
      <label for="categorySelect" class="block text-sm font-medium text-gray-700 mb-2">Categoría</label>
      <select id="categorySelect"
        class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
        <option value="all">Todas</option>
        <option value="proyectos">Proyectos</option>
        <option value="categoria1">Categoría 1</option>
        <option value="categoria2">Categoría 2</option>
      </select>
    </div>

    <!-- Selector 2: Subcategorías -->
    <div>
      <label for="subCategorySelect" class="block text-sm font-medium text-gray-700 mb-2">Subcategoría</label>
      <select id="subCategorySelect"
        class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
        <!-- Opciones dinámicas -->
      </select>
    </div>

    <!-- Selector 3: Tipo de visualización -->
    <div>
      <label for="displayTypeSelect" class="block text-sm font-medium text-gray-700 mb-2">Tipo de visualización</label>
      <select id="displayTypeSelect"
        class="w-full rounded-xl border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 transition">
        <option value="select">Select</option>
        <option value="checkbox">Checkboxes</option>
      </select>
    </div>
  </div>

  <!-- Contenedor dinámico de checkboxes -->
  <div id="subCategoryCheckboxes" class="mb-6 flex flex-wrap gap-4"></div>

  <!-- Botón de aplicar filtros -->
  <div class="text-right">
    <button
      class="px-6 py-2 rounded-xl bg-blue-600 text-white font-medium shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
      Aplicar filtros
    </button>
  </div>
</div>
