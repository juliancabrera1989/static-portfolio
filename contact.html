  <!-- Contact Section -->
<section class="contact-section container" data-aos="fade-up">
    <h1 data-i18n="contact_title">Contact Me</h1>
    <p data-i18n="contact_subtitle">Feel free to reach out for job offers, collaborations, or tech-related questions.</p>

    <form class="contact-form">
      <label for="name" data-i18n="contact_label_name">Name</label>
      <input type="text" id="name" name="name" required placeholder="Your full name" data-i18n-placeholder="contact_ph_name">

      <label for="email" data-i18n="contact_label_email">Email</label>
      <input type="email" id="email" name="email" required placeholder="Your email address" data-i18n-placeholder="contact_ph_email">

      <label for="message" data-i18n="contact_label_message">Message</label>
      <textarea id="message" name="message" required placeholder="Type your message here..." data-i18n-placeholder="contact_ph_message"></textarea>

      <button type="submit" class="btn" data-i18n="contact_btn_send">Send Message</button>
    </form>
  </section>
